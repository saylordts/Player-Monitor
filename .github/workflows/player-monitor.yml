name: player-monitor-workflow

on: 
    schedule:
        - cron: "0 8 * * 0"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    player-monitor:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4
    
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip'
    
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
        
        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        - name: Install Node dependencies
          run: npm ci
    
        - name: Run player monitor script
          env: 
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
            SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          run: |
            python main.py --no-debug

        - name: Check for updated player data
          run: |
            git status
            git diff -- _Data/playerLinks.csv

        - name: Commit updated player data
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add _Data/playerLinks.csv

            git diff --cached --quiet
            git commit -m "Update player data"
            git push